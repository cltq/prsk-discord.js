services:
  bot:
    build: .
    working_dir: /app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_CREATOR=${BOT_CREATOR}
    command: bun run start
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8899').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
